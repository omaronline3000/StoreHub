<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Hub</title>
</head>
<body>

    <div id="div" style="border-radius: 12px; background-color: red;"></div>

    <input type="button" id="butt" onclick="AJAX(3)">

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        var div = document.getElementById("div");
        function AJAX(id){
            $.ajax({url: "http://localhost:5002/api/Category/"+id, success: function(result){
            div.innerHTML = JSON.stringify(result, null, 2);
            }});
        }
    </script>
</html>
